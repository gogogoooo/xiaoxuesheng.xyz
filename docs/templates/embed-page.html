<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="referrer" content="no-referrer">
    <title>页面标题</title>
    <style>
      :root { font-family: system-ui, "Microsoft YaHei", sans-serif; color: #20242b; background: #fff; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(100%, 960px); margin: auto; padding: clamp(16px, 4vw, 40px); overflow-wrap: anywhere; }
      h1 { margin-top: 0; font-size: clamp(24px, 4vw, 36px); line-height: 1.3; }
      p { line-height: 1.8; }
      img, video, svg { max-width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>页面标题</h1>
      <p>在这里编写要嵌入外部文档的页面内容。</p>
    </main>
  </body>
</html>
